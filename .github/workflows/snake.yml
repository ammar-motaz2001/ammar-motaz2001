name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0bbb89&color_dots=#ebedf0,#b9f6d4,#6ee7b0,#18a364,#188a47
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#0bbb89&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish the animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
